<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PIP">
<meta name="theme-color" content="#000000">
<title>PIP · yes / no</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--g:#C6FF00;--dim:#7d8873;--line:#20261a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:#eef4e6;font-family:'JetBrains Mono',ui-monospace,monospace;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;padding:calc(12px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom))}
.top{width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:center}
.logo{font-family:'Bebas Neue';font-size:32px;letter-spacing:.06em}
.logo small{font-family:'JetBrains Mono';font-size:11px;color:var(--dim);letter-spacing:0;margin-left:8px}
a.back{color:var(--dim);font-size:11.5px;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 10px}
#stage{flex:1;width:100%;max-width:520px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;min-height:0}
#pip{font-weight:700;line-height:1;white-space:pre;font-size:clamp(9px,2.55vw,13px);transition:color .4s,text-shadow .4s;color:#9fb3c8}
#word{position:absolute;bottom:4%;left:0;right:0;text-align:center;font-family:'Bebas Neue';font-size:clamp(56px,18vw,96px);letter-spacing:.06em;opacity:0;transform:scale(.8);transition:opacity .25s,transform .25s}
#word.on{opacity:1;transform:scale(1)}
#q{position:absolute;top:2%;left:0;right:0;text-align:center;font-size:13px;color:var(--dim);padding:0 10px}
.ask{width:100%;max-width:520px;display:flex;gap:8px}
input{flex:1;font:500 15px 'JetBrains Mono';background:#0c0f0a;color:#eef4e6;border:1px solid var(--line);border-radius:14px;padding:13px 14px;min-width:0}
input:focus{outline:1px solid var(--g)}
button{font:700 14px 'JetBrains Mono';border-radius:14px;border:1px solid var(--line);background:#0c0f0a;color:#eef4e6;padding:0 16px;cursor:pointer}
#go{background:var(--g);color:#000;border:0}
#mic.on{background:#ff3b3b;border-color:#ff3b3b}
.hint{font-size:11px;color:#3c4636;margin-top:10px;text-align:center}
</style>
</head>
<body>
<div class="top"><div class="logo">PIP<small>asks nothing · answers yes or no</small></div><a class="back" href="../">← projects</a></div>
<div id="stage">
  <div id="q"></div>
  <pre id="pip"></pre>
  <div id="word"></div>
</div>
<form class="ask" id="form">
  <input id="input" placeholder="ask PIP a yes/no question…" autocomplete="off" enterkeyhint="send">
  <button type="button" id="mic" title="Ask out loud">🎙</button>
  <button type="submit" id="go">ASK</button>
</form>
<div class="hint">or just think of a question and tap PIP</div>

<script>
const $ = id => document.getElementById(id);
const pre = $("pip");
const W = 64, H = 32;                       // character grid for PIP
const LUM = ".,-~:;=!*#$@";
let A = 0, B = 0;                           // spin angles
let state = "idle", stateT = 0, answerAt = 0;
let morph = 0;                              // 0 = idle ring, 1 = answer shape
let thinking = 0;

// PIP is a ring (torus). It reshapes itself to answer:
//   YES → thin bright ring that nods up and down
//   NO  → fat twisted ring that shakes left and right
function frame(t){
  requestAnimationFrame(frame);
  const dt = 1/60; stateT += dt;
  const yes = state === "yes", no = state === "no";
  const target = yes || no ? 1 : 0;
  morph += (target - morph) * 0.08;
  thinking = state === "think" ? Math.min(1, thinking + .05) : Math.max(0, thinking - .05);

  // spin: idle drifts, thinking spins fast, answers hold still and gesture
  const spin = 1 + thinking * 6;
  A += 0.035 * spin * (1 - morph * .85); B += 0.02 * spin * (1 - morph * .85);
  let nod = 0, shake = 0;
  if (yes) nod = Math.sin(stateT * 9) * 0.55 * Math.max(0, 1 - stateT / 2.6);
  if (no) shake = Math.sin(stateT * 13) * 0.6 * Math.max(0, 1 - stateT / 2.6);

  const R1 = yes ? 1 - morph * .55 : no ? 1 + morph * .35 : 1;        // tube thickness
  const R2 = yes ? 2 + morph * .7 : no ? 2 - morph * .35 : 2;          // ring size
  const twist = no ? morph * 2 : 0;
  const K2 = 5, K1 = W * K2 * 3 / (8 * (R1 + R2)) * 0.95;
  const out = new Array(W * H).fill(" "), zb = new Float32Array(W * H);
  const cA = Math.cos(A + nod), sA = Math.sin(A + nod), cB = Math.cos(B + shake), sB = Math.sin(B + shake);
  for (let th = 0; th < 6.283; th += 0.06) {
    const ct = Math.cos(th), st = Math.sin(th);
    for (let ph = 0; ph < 6.283; ph += 0.02) {
      const cp = Math.cos(ph + twist * Math.sin(th)), sp = Math.sin(ph + twist * Math.sin(th));
      const r = R1 * (1 + (no ? .25 * morph * Math.sin(th * 5 + ph * 3 + stateT * 6) : 0));
      const cx = R2 + r * ct, cy = r * st;
      const x = cx * (cB * cp + sA * sB * sp) - cy * cA * sB;
      const y = cx * (sB * cp - sA * cB * sp) + cy * cA * cB;
      const z = K2 + cA * cx * sp + cy * sA;
      const ooz = 1 / z;
      const xp = Math.floor(W / 2 + K1 * ooz * x), yp = Math.floor(H / 2 - K1 * ooz * y * 0.5);
      if (xp < 0 || xp >= W || yp < 0 || yp >= H) continue;
      const L = cp * ct * sB - cA * ct * sp - sA * st + cB * (cA * st - ct * sA * sp);
      const o = xp + W * yp;
      if (ooz > zb[o]) { zb[o] = ooz; out[o] = LUM[Math.max(0, Math.min(LUM.length - 1, Math.floor((L + .3) * 8)))]; }
    }
  }
  let s = ""; for (let y = 0; y < H; y++) s += out.slice(y * W, y * W + W).join("") + "\n";
  pre.textContent = s;
  if (state === "think" && performance.now() > answerAt) reveal();
  if ((yes || no) && stateT > 4) toIdle();
}

// ---------- sound ----------
let ac = null;
function tone(f0, f1, d, type = "square", v = .06, delay = 0){
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime + delay;
    o.type = type; o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(f1, t0 + d);
    g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0 + d + .02);
  } catch (e) {}
}

// ---------- asking ----------
function ask(question){
  if (state === "think") return;
  $("q").textContent = question ? "“" + question + "”" : "…";
  $("word").classList.remove("on");
  state = "think"; stateT = 0; answerAt = performance.now() + 1100 + Math.random() * 700;
  pre.style.color = "#cfe0f0"; pre.style.textShadow = "0 0 18px rgba(160,200,255,.35)";
  for (let i = 0; i < 6; i++) tone(500 + Math.random() * 900, 500 + Math.random() * 900, .06, "square", .025, i * .13);
}
function reveal(){
  const r = new Uint8Array(1); (crypto || window.msCrypto).getRandomValues(r);
  const yes = r[0] < 128;
  state = yes ? "yes" : "no"; stateT = 0;
  const w = $("word"); w.textContent = yes ? "YES" : "NO"; w.style.color = yes ? "#C6FF00" : "#ff4d4d"; w.classList.add("on");
  pre.style.color = yes ? "#C6FF00" : "#ff4d4d";
  pre.style.textShadow = yes ? "0 0 22px rgba(198,255,0,.55)" : "0 0 22px rgba(255,77,77,.55)";
  if (yes) { tone(520, 780, .12, "triangle", .09); tone(780, 1170, .16, "triangle", .09, .13); }
  else { tone(300, 180, .22, "sawtooth", .07); tone(260, 150, .26, "sawtooth", .07, .2); }
  if (navigator.vibrate) navigator.vibrate(yes ? [30, 40, 30] : [120]);
}
function toIdle(){ state = "idle"; stateT = 0; pre.style.color = "#9fb3c8"; pre.style.textShadow = "none"; $("word").classList.remove("on"); }

$("form").onsubmit = e => { e.preventDefault(); const q = $("input").value.trim(); $("input").value = ""; $("input").blur(); ask(q); };
$("stage").onclick = () => ask("");

// ---------- ask out loud (Safari / Chrome speech recognition, when available) ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) $("mic").style.display = "none";
$("mic").onclick = () => {
  if (!SR) return;
  const rec = new SR(); rec.lang = navigator.language || "en-US"; rec.interimResults = false; rec.maxAlternatives = 1;
  $("mic").classList.add("on"); $("q").textContent = "listening…";
  rec.onresult = e => { const q = e.results[0][0].transcript; ask(q); };
  rec.onerror = () => { $("q").textContent = "didn't catch that, try typing"; };
  rec.onend = () => $("mic").classList.remove("on");
  try { rec.start(); } catch (e) { $("mic").classList.remove("on"); }
};

requestAnimationFrame(frame);
</script>
</body>
</html>
