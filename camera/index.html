<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>ASCII Cam</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--g:#C6FF00;--dim:#7d8873;--line:#20261a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:#eef4e6;font-family:'JetBrains Mono',ui-monospace,monospace;overflow:hidden;touch-action:manipulation}
#out{position:fixed;inset:0;width:100%;height:100%;display:block}
video{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none}
.top{position:fixed;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;z-index:3;pointer-events:none}
.top>*{pointer-events:auto}
.logo{font-family:'Bebas Neue';font-size:26px;letter-spacing:.04em;text-shadow:0 0 12px #000}
.logo b{color:var(--g);font-weight:400}
.back{color:var(--dim);text-decoration:none;font-size:12px;background:rgba(0,0,0,.55);border:1px solid var(--line);border-radius:999px;padding:6px 11px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(14px + env(safe-area-inset-bottom));z-index:3;
 background:linear-gradient(transparent,rgba(0,0,0,.85) 30%);display:grid;gap:10px}
.row{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
button,.chip{font:700 12px 'JetBrains Mono',monospace;color:#eef4e6;background:rgba(15,18,13,.85);border:1px solid var(--line);border-radius:999px;padding:9px 13px;cursor:pointer}
button.on{color:#000;background:var(--g);border-color:var(--g)}
#shoot{width:66px;height:66px;border-radius:50%;padding:0;background:transparent;border:4px solid #fff;position:relative}
#shoot:after{content:"";position:absolute;inset:5px;border-radius:50%;background:#fff}
#shoot:active:after{background:var(--g)}
label{font-size:11px;color:var(--dim);display:flex;align-items:center;gap:8px}
input[type=range]{width:150px;accent-color:var(--g)}
#start{position:fixed;inset:0;z-index:5;display:grid;place-items:center;text-align:center;padding:24px;background:#000}
#start h1{font-family:'Bebas Neue';font-weight:400;font-size:64px;line-height:.9}
#start h1 b{color:var(--g);font-weight:400}
#start p{color:var(--dim);font-size:13px;margin:14px auto 22px;max-width:300px;line-height:1.6}
#go{font-size:15px;padding:14px 26px;color:#000;background:var(--g);border:0}
#err{color:#ff6b6b;font-size:12px;margin-top:14px;max-width:320px}
#shot{position:fixed;inset:0;z-index:6;background:rgba(0,0,0,.92);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
#shot img{max-width:100%;max-height:72vh;border-radius:12px;border:1px solid var(--line)}
#shot p{color:var(--dim);font-size:12px;text-align:center}
</style>
</head>
<body>
<video id="v" playsinline muted autoplay></video>
<canvas id="out"></canvas>

<div class="top"><div class="logo">ASCII <b>CAM</b></div><a class="back" href="../">← projects</a></div>

<div class="bar">
  <div class="row">
    <button id="flip">⟲ flip</button>
    <button id="shoot" aria-label="Take a picture"></button>
    <button id="look">look: green</button>
  </div>
  <div class="row">
    <label>detail <input id="size" type="range" min="40" max="140" value="72"></label>
    <button id="chars">chars: classic</button>
    <button id="inv">invert</button>
  </div>
</div>

<div id="start"><div>
  <h1>ASCII<br><b>CAM</b></h1>
  <p>Your camera, drawn live with text characters. Nothing is uploaded: it all happens on your phone.</p>
  <button id="go">Turn on camera</button>
  <div id="err"></div>
</div></div>

<div id="shot"><img id="shotImg" alt="Your ASCII picture"><p>Press and hold the picture → Save to Photos</p><div class="row"><button id="share">Share</button><button id="close">Close</button></div></div>

<script>
const $ = id => document.getElementById(id);
const v = $("v"), out = $("out"), ctx = out.getContext("2d");
const sample = document.createElement("canvas"), sctx = sample.getContext("2d", {willReadFrequently:true});
const SETS = {
  classic: " .:-=+*#%@",
  blocks:  " ░▒▓█",
  dense:   " .'`^\",:;Il!i><~+_-?][}{1)(|/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$",
  binary:  " 01",
  emoji:   " ·•●⬤"
};
const LOOKS = ["green", "color", "mono", "amber"];
let facing = "user", stream = null, setName = "classic", look = 0, invert = false, cols = +$("size").value;
const dpr = Math.min(window.devicePixelRatio || 1, 2);

function fit(){
  out.width = innerWidth * dpr; out.height = innerHeight * dpr;
}
addEventListener("resize", fit); fit();

async function startCam(){
  if (stream) stream.getTracks().forEach(t => t.stop());
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: {ideal: 1280}, height: {ideal: 720} }, audio: false });
    v.srcObject = stream; await v.play();
    $("start").style.display = "none";
  } catch (e) {
    $("start").style.display = "grid";
    $("err").textContent = (e && e.name === "NotAllowedError")
      ? "Camera blocked. On iPhone: Settings → Safari → Camera → Allow, then reload."
      : "Couldn't open the camera (" + (e && e.name || "error") + "). This needs Safari or Chrome over https.";
  }
}

function draw(){
  requestAnimationFrame(draw);
  if (!v.videoWidth) return;
  const W = out.width, H = out.height;
  const chars = SETS[setName];
  // cell size from the "detail" slider: number of columns across the screen
  const cw = W / cols, ch = cw * 1.9;
  const rows = Math.max(1, Math.floor(H / ch));
  sample.width = cols; sample.height = rows;
  // cover-crop the video into the grid (keeps the face undistorted)
  const vr = v.videoWidth / v.videoHeight, gr = (cols * cw) / (rows * ch);
  let sw = v.videoWidth, sh = v.videoHeight, sx = 0, sy = 0;
  if (vr > gr) { sw = sh * gr; sx = (v.videoWidth - sw) / 2; } else { sh = sw / gr; sy = (v.videoHeight - sh) / 2; }
  sctx.save();
  if (facing === "user") { sctx.translate(cols, 0); sctx.scale(-1, 1); }   // selfie = mirror, like the camera app
  sctx.drawImage(v, sx, sy, sw, sh, 0, 0, cols, rows);
  sctx.restore();
  const px = sctx.getImageData(0, 0, cols, rows).data;
  const L = LOOKS[look];
  ctx.fillStyle = L === "mono" && invert ? "#fff" : "#000";
  ctx.fillRect(0, 0, W, H);
  ctx.font = `700 ${ch * 0.92}px "JetBrains Mono", ui-monospace, monospace`;
  ctx.textBaseline = "top";
  const offY = (H - rows * ch) / 2;
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const i = (y * cols + x) * 4, r = px[i], g = px[i+1], b = px[i+2];
      let lum = (0.299*r + 0.587*g + 0.114*b) / 255;
      if (invert) lum = 1 - lum;
      const c = chars[Math.min(chars.length - 1, Math.floor(lum * chars.length))];
      if (c === " ") continue;
      if (L === "color") ctx.fillStyle = `rgb(${r},${g},${b})`;
      else if (L === "green") ctx.fillStyle = `rgba(198,255,0,${0.35 + lum*0.65})`;
      else if (L === "amber") ctx.fillStyle = `rgba(255,176,0,${0.35 + lum*0.65})`;
      else ctx.fillStyle = invert ? "#000" : "#fff";
      ctx.fillText(c, x * cw, offY + y * ch);
    }
  }
}

$("go").onclick = startCam;
$("flip").onclick = () => { facing = facing === "user" ? "environment" : "user"; startCam(); };
$("look").onclick = () => { look = (look + 1) % LOOKS.length; $("look").textContent = "look: " + LOOKS[look]; };
$("chars").onclick = () => { const k = Object.keys(SETS); setName = k[(k.indexOf(setName) + 1) % k.length]; $("chars").textContent = "chars: " + setName; };
$("inv").onclick = () => { invert = !invert; $("inv").classList.toggle("on", invert); };
$("size").oninput = e => cols = +e.target.value;

let lastBlob = null;
$("shoot").onclick = () => {
  out.toBlob(b => {
    lastBlob = b;
    $("shotImg").src = URL.createObjectURL(b);
    $("shot").style.display = "flex";
  }, "image/png");
};
$("close").onclick = () => { $("shot").style.display = "none"; };
$("share").onclick = async () => {
  if (!lastBlob) return;
  const f = new File([lastBlob], "ascii-cam.png", { type: "image/png" });
  try { if (navigator.canShare && navigator.canShare({ files: [f] })) await navigator.share({ files: [f], title: "ASCII Cam" }); } catch (e) {}
};

requestAnimationFrame(draw);
</script>
</body>
</html>
